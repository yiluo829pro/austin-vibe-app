<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe Tonight Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Radio+Canada+Big:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#09090B; --panel:#18181B; --panel2:#27272A; --line:#3F3F46;
    --cream:#FFFBEB; --text:#F4F4F5; --muted:#A1A1AA; --dim:#71717B;
    --amber:#FFBA00; --amber-dk:#C98F00; --green:#4ADE80; --red:#F87171;
    --head:"Radio Canada Big", system-ui, sans-serif;
    --body:"Geist", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px;border-bottom:1px solid var(--panel2);flex-wrap:wrap}
  .brand{font-family:var(--head);font-weight:700;font-size:18px;color:var(--cream)}
  .brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
  .seg{display:flex;background:var(--panel);border:1px solid var(--panel2);border-radius:999px;padding:4px}
  .seg button{padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
  .seg button.on{background:var(--amber);color:#111}
  .stage{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:40px;max-width:1180px;margin:0 auto;padding:32px 24px 64px;align-items:start}
  @media (max-width:900px){.stage{grid-template-columns:1fr;padding:20px 16px 48px}}

  /* phone */
  .phone{width:100%;max-width:390px;margin:0 auto;height:780px;border-radius:44px;border:10px solid #000;background:var(--bg);outline:1px solid var(--panel2);overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column}
  .status{display:flex;justify-content:space-between;padding:12px 22px 6px;font-size:12px;font-weight:600;color:var(--text)}
  .scroll{flex:1;overflow-y:auto;padding:4px 18px 90px}
  .scroll::-webkit-scrollbar{display:none}
  .nav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:10px 6px 22px;background:rgba(9,9,11,.94);border-top:1px solid var(--panel2)}
  .nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--dim);min-width:64px}
  .nav button.on{color:var(--amber)}
  .nav svg{width:22px;height:22px}
  h1,h2,h3{font-family:var(--head);color:var(--cream)}
  .hello{font-size:26px;font-weight:600;margin-top:6px}
  .sub{font-size:13px;color:var(--muted);margin-top:4px}
  .chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}
  .chip.amber{background:var(--amber);color:#111}
  .chip.ghost{border:1px solid var(--line);color:var(--text)}
  .chip.boost{background:rgba(255,186,0,.14);color:var(--amber);border:1px solid rgba(255,186,0,.4)}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sec{margin-top:22px}
  .sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .sec-h h3{font-size:17px;font-weight:700}
  .sec-h span{font-size:12px;color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--panel2);border-radius:20px;overflow:hidden;margin-bottom:12px;text-align:left;width:100%;display:block}
  .card:hover{border-color:var(--line)}
  .pic{height:118px;position:relative;display:flex;align-items:flex-end;padding:10px}
  .pic .badge{position:absolute;top:10px;left:10px}
  .pic .left{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:var(--cream);font-size:11px;font-weight:600;padding:5px 9px;border-radius:999px}
  .cbody{padding:12px 14px 14px}
  .cname{font-family:var(--head);font-size:17px;font-weight:700;color:var(--cream)}
  .cmeta{font-size:12px;color:var(--muted);margin-top:3px}
  .why{font-size:12px;color:var(--text);margin-top:8px;display:flex;gap:6px;align-items:center}
  .why i{font-style:normal;color:var(--amber)}
  .mini{display:flex;gap:10px;align-items:center;padding:10px;background:var(--panel);border:1px solid var(--panel2);border-radius:16px;margin-bottom:10px;width:100%;text-align:left}
  .mini .thumb{width:52px;height:52px;border-radius:12px;flex:none}
  .mini .pct{margin-left:auto;font-weight:700;font-size:13px;color:var(--muted)}
  .hint{font-size:11px;color:var(--dim);margin-top:6px}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:4px 0 10px}
  .hero{height:190px;border-radius:22px;position:relative;margin-bottom:14px}
  .hero .left{position:absolute;right:12px;top:12px;background:rgba(0,0,0,.6);font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;color:var(--cream)}
  .big{font-size:28px;font-weight:700;line-height:1.1}
  .boostbox{background:var(--cream);color:#18181B;border-radius:18px;padding:14px 16px;margin:14px 0}
  .boostbox b{font-family:var(--head);font-size:22px}
  .boostbox p{font-size:13px;margin-top:4px;color:#3F3F46}
  .label{font-size:12px;color:var(--muted);margin:14px 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
  .slots{display:flex;gap:8px;flex-wrap:wrap}
  .slot{border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600;min-width:76px;text-align:center}
  .slot small{display:block;font-size:10px;font-weight:500;color:var(--muted);margin-top:2px}
  .slot.on{border-color:var(--amber);background:rgba(255,186,0,.12)}
  .slot.off{opacity:.35;pointer-events:none}
  .stepper{display:flex;align-items:center;gap:14px}
  .stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);font-size:18px}
  .cta{display:block;width:100%;background:var(--amber);color:#111;font-weight:700;font-size:15px;padding:15px;border-radius:999px;margin-top:18px;text-align:center}
  .cta:hover{background:#FFC933}
  .cta.ghost{background:transparent;color:var(--text);border:1px solid var(--line);margin-top:10px}
  .cta:disabled{opacity:.4;cursor:not-allowed}
  .center{text-align:center}
  .check{width:64px;height:64px;border-radius:50%;background:var(--amber);color:#111;display:flex;align-items:center;justify-content:center;margin:26px auto 12px;font-size:30px;font-weight:700}
  .kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--panel2);font-size:14px}
  .kv span:first-child{color:var(--muted)}
  .amountin{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;color:var(--cream);font-family:var(--head);font-size:34px;font-weight:700;padding:14px 16px}
  .impact{background:var(--panel);border:1px solid var(--panel2);border-radius:18px;padding:16px;margin-top:16px;text-align:left}
  .impact h4{font-family:var(--head);color:var(--cream);font-size:16px;margin-bottom:6px}
  .impact p{font-size:13px;color:var(--muted);line-height:1.5}
  .stars{display:flex;gap:6px;justify-content:center;margin-top:12px}
  .stars button{font-size:26px;color:var(--line)}
  .stars button.on{color:var(--amber)}
  .drop{background:linear-gradient(160deg,#3b2a12,#18181B 60%);border:1px solid rgba(255,186,0,.35);border-radius:22px;padding:18px;margin-top:10px}
  .timer{font-family:var(--head);font-size:34px;font-weight:700;color:var(--amber);letter-spacing:.02em}
  .seats{display:flex;gap:8px;margin-top:12px}
  .seat{flex:1;border-radius:12px;padding:10px;text-align:center;font-size:12px;background:var(--panel2)}
  .seat.taken{opacity:.35;text-decoration:line-through}
  .fine{font-size:11px;color:var(--dim);margin-top:10px;line-height:1.5}
  .toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--cream);color:#111;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600;transform:translateY(20px);opacity:0;transition:.25s;pointer-events:none;z-index:5}
  .toast.show{opacity:1;transform:none}
  .push{position:absolute;left:10px;right:10px;top:34px;background:rgba(39,39,42,.97);border:1px solid var(--line);border-radius:18px;padding:12px 14px;z-index:6;transform:translateY(-140%);transition:.35s;text-align:left;width:auto}
  .push.show{transform:none}
  .push .app{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
  .push b{display:block;font-size:14px;color:var(--cream);margin-top:4px}
  .push p{font-size:13px;color:var(--text);margin-top:2px}

  /* moment lists, passport, content */
  .occ{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:2px}
  .occ::-webkit-scrollbar{display:none}
  .occ button{flex:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--text);background:var(--panel)}
  .occ button:hover{border-color:var(--amber)}
  .litem{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--panel2);width:100%;text-align:left}
  .litem .num{font-family:var(--head);font-size:20px;font-weight:700;color:var(--amber);width:22px;flex:none}
  .litem .thumb{width:56px;height:56px;border-radius:12px;flex:none}
  .litem b{color:var(--cream);font-size:15px;font-family:var(--head)}
  .litem p{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
  .room{display:inline-block;margin-top:6px;font-size:11px;font-weight:600;color:var(--amber);background:rgba(255,186,0,.12);border-radius:999px;padding:3px 8px}
  .pass{background:var(--cream);color:#18181B;border-radius:22px;padding:18px;margin-top:12px}
  .pass h3{color:#18181B;font-size:20px}
  .pass p{font-size:13px;color:#3F3F46;margin-top:4px}
  .bar{height:10px;border-radius:999px;background:#E4E4E7;margin-top:14px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--amber);border-radius:999px;transition:width .5s}
  .stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
  .stamp{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;font-weight:600;color:var(--dim);padding:6px;line-height:1.2}
  .stamp.got{border:2px solid var(--amber);background:rgba(255,186,0,.12);color:var(--cream)}
  .photo{margin-top:14px;border:1px dashed var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;width:100%;text-align:left}
  .photo .ph{width:56px;height:56px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
  .photo.done{border-style:solid;border-color:var(--amber)}
  .yn{display:flex;gap:8px;margin-top:10px}
  .yn button{flex:1;border:1px solid var(--line);border-radius:999px;padding:10px;font-size:13px;font-weight:600}
  .yn button.on{background:var(--amber);color:#111;border-color:var(--amber)}
  .stampnote{margin-top:14px;background:rgba(255,186,0,.1);border:1px solid rgba(255,186,0,.35);border-radius:14px;padding:12px;font-size:13px;color:var(--cream);text-align:left}
  .verdict{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;margin-bottom:8px}
  .v-yes{background:rgba(74,222,128,.15);color:var(--green)}
  .v-lite{background:rgba(255,186,0,.15);color:var(--amber)}

  /* side panel */
  .side h2{font-size:30px;font-weight:600;line-height:1.15}
  .side .lede{color:var(--muted);font-size:15px;line-height:1.6;margin-top:10px;max-width:620px}
  .note{display:inline-block;margin-top:14px;font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
  .blocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:22px}
  @media (max-width:640px){.blocks{grid-template-columns:1fr}}
  .blk{background:var(--panel);border:1px solid var(--panel2);border-radius:18px;padding:16px}
  .blk h4{font-family:var(--head);color:var(--cream);font-size:15px;margin-bottom:8px}
  .blk p,.blk li{font-size:13px;color:var(--muted);line-height:1.55}
  .blk ul{padding-left:18px}
  .demo{margin-top:22px}
  .demo h4{font-family:var(--head);color:var(--cream);font-size:15px;margin-bottom:10px}
  .demo ol{list-style:none;display:grid;gap:8px}
  .demo li button{width:100%;text-align:left;display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--panel2);border-radius:14px;padding:12px 14px;font-size:14px}
  .demo li button:hover{border-color:var(--amber)}
  .demo .n{width:26px;height:26px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--amber);flex:none}

  /* portal */
  .portal{display:none;max-width:1180px;margin:0 auto;padding:32px 24px 64px}
  .browser{background:var(--panel);border:1px solid var(--panel2);border-radius:18px;overflow:hidden}
  .bbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--panel2)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--panel2)}
  .url{margin-left:10px;font-size:12px;color:var(--dim);background:var(--bg);border-radius:8px;padding:5px 12px;flex:1;max-width:420px}
  .pbody{padding:24px}
  .pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px;margin-top:18px}
  @media (max-width:900px){.pgrid{grid-template-columns:1fr}}
  .pcard{background:var(--bg);border:1px solid var(--panel2);border-radius:16px;padding:18px}
  .pcard h4{font-family:var(--head);color:var(--cream);font-size:15px;margin-bottom:4px}
  .pcard .s{font-size:12px;color:var(--muted)}
  .gauge{margin-top:18px}
  .track{position:relative;height:14px;border-radius:999px;background:var(--panel2)}
  .band{position:absolute;top:0;bottom:0;left:33.3%;width:33.3%;background:rgba(74,222,128,.25);border-left:2px solid var(--green);border-right:2px solid var(--green)}
  .needle{position:absolute;top:-6px;width:4px;height:26px;border-radius:2px;background:var(--amber);transition:left .5s}
  .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:8px}
  .gnum{font-family:var(--head);font-size:40px;font-weight:700;color:var(--cream);margin-top:14px}
  .gnum span{font-size:14px;color:var(--muted);font-family:var(--body);font-weight:500;margin-left:6px}
  .status-pill{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
  .heat{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:4px;margin-top:14px;font-size:11px;color:var(--dim)}
  .heat div{text-align:center}
  .cell{height:26px;border-radius:6px}
  .cell.slow{outline:2px solid var(--amber);outline-offset:-2px}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
  .rec{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--panel2)}
  .rec:last-child{border-bottom:none}
  .rec .t{flex:1}
  .rec .t b{display:block;color:var(--cream);font-size:14px}
  .rec .t span{font-size:12px;color:var(--muted)}
  .switch{width:46px;height:26px;border-radius:999px;background:var(--panel2);position:relative;flex:none;transition:.2s}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.2s}
  .switch.on{background:var(--amber)}
  .switch.on::after{left:23px;background:#111}
  .totals{display:flex;gap:24px;margin-top:14px;flex-wrap:wrap}
  .totals div{font-size:12px;color:var(--muted)}
  .totals b{display:block;font-family:var(--head);font-size:22px;color:var(--cream)}
  .pcta{display:inline-block;text-decoration:none;background:var(--amber);color:#111;font-weight:700;padding:12px 20px;border-radius:999px;margin-top:16px;font-size:14px}
  .ptoast{margin-top:12px;font-size:13px;color:var(--green);min-height:18px}
  .disclaim{max-width:1180px;margin:0 auto;padding:0 24px 40px;font-size:12px;color:var(--dim)}
</style>
</head>

<div class="topbar">
  <div class="brand">vibe<span style="color:var(--amber)">.</span></div>
</div>

<!-- DINER VIEW -->
<div class="stage" id="dinerView">
  <div class="phone" id="phone">
    <div class="screen">
      <div class="status"><span>5:12</span><span>East Austin</span></div>
      <button class="push" id="push" onclick="hidePush()">
        <div class="app"><span>VIBE</span><span>now</span></div>
        <b>Fig &amp; Ash has room tonight</b>
        <p>2 tables left at 6:00, a 6-minute walk from you.</p>
      </button>
      <div class="scroll" id="scr"></div>
      <div class="toast" id="toast"></div>
      <nav class="nav" id="nav">
        <button data-t="home" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Tonight</button>
        <button data-t="drops" onclick="go('drops')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.6 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg>Drops</button>
        <button data-t="passport" onclick="go('passport')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M9 16h6"/></svg>Passport</button>
      </nav>
    </div>
  </div>

  <div class="side">
    <div class="demo">
      <h4>Screens</h4>
      <ol>
        <li><button onclick="go('home');showPush()"><span class="n">1</span>Push notification</button></li>
        <li><button onclick="go('drops')"><span class="n">2</span>Thursday Drop</button></li>
        <li><button onclick="openList('date')"><span class="n">3</span>Moment list</button></li>
        <li><button onclick="go('passport')"><span class="n">4</span>City passport</button></li>
      </ol>
    </div>
  </div>
</div>


<script>
const R = {
  fig:{name:"Fig & Ash",cuisine:"Wood-fired small plates · Wine bar",dist:"0.3 mi · 6 min walk",base:20,boost:30,until:"7 pm",left:"2 tables left",why:"After-work bites and natural wine, like your last 3 visits",bg:"linear-gradient(135deg,#5a2d14,#c0602a 55%,#2b1408)"},
  lumbre:{name:"Casa Lumbre",cuisine:"Modern Mexican · Mezcal",dist:"0.8 mi · 4 min drive",base:20,boost:25,until:"6:30 pm",left:"Bar seats open",why:"Happy-hour window, $40 average check",bg:"linear-gradient(135deg,#1f3b2c,#4f8a5b 55%,#0f1f17)"},
  lowtide:{name:"Low Tide",cuisine:"Oysters · Cocktails",dist:"1.1 mi · 5 min drive",base:20,boost:25,until:"8 pm",left:"1 table left",why:"Quiet before 8 pm on weekdays",bg:"linear-gradient(135deg,#123044,#2f7ea6 55%,#081822)"}
};
const usual=[["Sunday Table","Brunch · Cafe","#7a4b2a"],["Oro","Italian · Pasta","#6b2a2a"],["Kinfolk Noodle","Noodles","#40532a"]];
let state={tab:"home",rid:"fig",slot:"6:00",party:2,held:false,amount:"84.00",paid:false,stars:0,dropClaimed:false,list:"date",photo:false,ret:null,stamps:["oro","kinfolk","sunday"]};
const PASS=[["fig","Fig & Ash",true],["lumbre","Casa Lumbre",true],["lowtide","Low Tide",true],["oro","Oro",false],["kinfolk","Kinfolk Noodle",false],["sunday","Sunday Table",false],["verde","Verde Taqueria",true],["ember","Ember Room",false]];
const LISTS={
  date:{title:"First date in East Austin",sub:"Impressive, not try-hard. Picked by local diners.",items:[["fig","Fig & Ash","Candlelit wine bar; share four small plates.","#c0602a"],["lowtide","Low Tide","Oysters and a quiet booth before 8 pm.","#2f7ea6"],["oro","Oro","Handmade pasta, easy to talk over.","#6b2a2a"],["lumbre","Casa Lumbre","Mezcal flight if the conversation is going well.","#4f8a5b"]]},
  after:{title:"After work, zero planning",sub:"Light bites and a drink within 10 minutes.",items:[["lumbre","Casa Lumbre","$40 average check, bar seats open now.","#4f8a5b"],["fig","Fig & Ash","Two plates and a glass of natural wine.","#c0602a"],["kinfolk","Kinfolk Noodle","Fast, warm, no reservation needed.","#40532a"]]},
  group:{title:"Group dinner for 6+",sub:"Big tables and family-style menus.",items:[["lumbre","Casa Lumbre","Family-style platters, long tables.","#4f8a5b"],["oro","Oro","Pasta for the table; private room.","#6b2a2a"]]},
  brunch:{title:"Sunday reset",sub:"Slow brunch, no rush.",items:[["sunday","Sunday Table","Chef's counter brunch, books out by Friday.","#7a4b2a"],["fig","Fig & Ash","Weekend brunch boards.","#c0602a"]]}
};

const scr=document.getElementById("scr");

function setView(){}
function go(t){state.tab=t;render();}
function nav(t){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));}
function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200);}
function showPush(){const p=document.getElementById("push");p.classList.add("show");setTimeout(hidePush,6000);}
function hidePush(){document.getElementById("push").classList.remove("show");}
function openDetail(id){toast("Opening "+R[id].name);}


function render(){
  const t=state.tab; nav(["home","drops","passport"].includes(t)?t:"home"); scr.scrollTop=0;
  if(t==="list") scr.innerHTML=listScreen();
  if(t==="passport") scr.innerHTML=passport();
  if(t==="home") scr.innerHTML=home();
  if(t==="drops"){scr.innerHTML=drops();tick();}
}

function boostCard(id){const r=R[id];return `
  <button class="card" onclick="openDetail('${id}')">
    <div class="pic" style="background:${r.bg}"><span class="chip amber badge">Room until ${r.until}</span><span class="left">${r.left}</span></div>
    <div class="cbody"><div class="cname">${r.name}</div><div class="cmeta">${r.cuisine} · ${r.dist}</div>
    <div class="why"><i>&#9679;</i>${r.why}</div></div>
  </button>`;}

function home(){
  const active=Object.keys(R);
  return `
  <div class="row" style="justify-content:space-between;margin-top:6px">
    <span class="chip ghost">Wed · Dinner for 2</span>
  </div>
  <h1 class="hello">Good evening</h1>
  <p class="sub">3 places near you have room tonight.</p>
  <div class="occ">
    <button onclick="openList('date')">First date</button><button onclick="openList('after')">After work</button><button onclick="openList('group')">Group of 6+</button><button onclick="openList('brunch')">Sunday reset</button>
  </div>
  <div class="sec"><div class="sec-h"><h3>Room tonight</h3><span>Near you</span></div>
    ${active.map(boostCard).join("")}
  </div>
  <div class="sec"><div class="sec-h"><h3>Your usual spots</h3><span>Visited recently</span></div>
    ${usual.map(u=>`<button class="mini" onclick="toast('Opening '+'${u[0]}')"><span class="thumb" style="background:${u[2]}"></span><span><b style="font-size:14px;color:var(--cream)">${u[0]}</b><div class="cmeta">${u[1]}</div></span></button>`).join("")}
  </div>`;
}








function openList(k){state.list=k;state.tab="list";render();}
function listScreen(){
  const L=LISTS[state.list];
  return `
  <button class="back" onclick="go('home')">&#8592; Tonight</button>
  <span class="chip ghost">Moment list</span>
  <h2 class="big" style="margin-top:10px">${L.title}</h2>
  <p class="sub">${L.sub}</p>
  <div style="margin-top:10px">
  ${L.items.map((it,i)=>{const boosted=R[it[0]];return `<button class="litem" onclick="${boosted?`openDetail('${it[0]}')`:`toast('Opening ${it[1]}')`}">
    <span class="num">${i+1}</span><span class="thumb" style="background:${it[3]}"></span>
    <span><b>${it[1]}</b><p>${it[2]}</p>${boosted?`<span class="room">Room tonight</span>`:`<span class="room" style="color:var(--muted);background:var(--panel2)">Popular</span>`}</span></button>`;}).join("")}
  </div>
  <button class="cta" onclick="toast('Link copied: share it to your group chat')">Share this list</button>`;
}

function passport(){
  const n=Math.min(5,state.stamps.length), pct=n/5*100;
  const next=PASS.filter(p=>!state.stamps.includes(p[0]));
  return `
  <h1 class="hello">Passport</h1>
  <p class="sub">Explore more of the city, one new spot at a time.</p>
  <div class="pass">
    <span style="font-size:11px;font-weight:700;letter-spacing:.08em;color:#52525B">EAST AUSTIN · ENDS DEC 31</span>
    <h3 style="margin-top:6px">${n>=5?"Passport complete":"Visit 5 new spots"}</h3>
    <p>${n>=5?"You explored 5 new spots in East Austin.":`${n} of 5 done. ${5-n} to go.`}</p>
    <div class="bar"><i style="width:${pct}%"></i></div>
  </div>
  <div class="stamps">${PASS.map(p=>`<div class="stamp ${state.stamps.includes(p[0])?"got":""}">${state.stamps.includes(p[0])?"&#10003;<br>":""}${p[1]}</div>`).join("")}</div>
  <div class="sec"><div class="sec-h"><h3>Suggested next stamps</h3><span>Have room this week</span></div>
    ${next.filter(p=>p[2]).map(p=>`<button class="mini" onclick="${R[p[0]]?`openDetail('${p[0]}')`:`toast('Opening Verde Taqueria (demo)')`}"><span class="thumb" style="background:${R[p[0]]?R[p[0]].bg:"#7a5a1a"}"></span><span><b style="font-size:14px;color:var(--cream)">${p[1]}</b><div class="cmeta">${R[p[0]]?R[p[0]].cuisine:"Tacos · Mezcal"}</div></span><span class="pct" style="color:var(--amber)">Stamp</span></button>`).join("")}
  </div>`;
}

let dropEnd=Date.now()+ (2*3600+14*60+33)*1000, timerId=null;
function drops(){
  const c=state.dropClaimed;
  return `
  <h1 class="hello">Thursday Drop</h1>
  <p class="sub">Weekend plans, sorted early. New drops every Thursday at noon.</p>
  <div class="drop">
    <span class="chip amber">2 seats</span>
    <h3 style="font-size:22px;margin-top:12px">Saturday brunch at Sunday Table</h3>
    <p class="sub">11:30 am · Chef's counter · Austin</p>
    <div class="label" style="margin-top:16px">Claim window closes in</div>
    <div class="timer" id="timer">02:14:33</div>
    <div class="seats"><div class="seat taken">Seat 1</div><div class="seat">${c?"Yours":"Seat 2"}</div></div>
    <button class="cta" ${c?"disabled":""} onclick="state.dropClaimed=true;render();toast('Seat claimed. See you Saturday at 11:30.')">${c?"Claimed":"Claim seat"}</button>
    <p class="fine">First come, first served; no purchase needed to claim. Pass members get one hour of early access.</p>
  </div>
  <div class="sec"><div class="sec-h"><h3>Next week</h3><span>Preview</span></div>
    <button class="mini" onclick="toast('We will remind you Thursday at noon.')"><span class="thumb" style="background:#6b2a2a"></span><span><b style="font-size:14px;color:var(--cream)">Oro: pasta tasting</b><div class="cmeta">Friday · 4 seats</div></span><span class="pct">Remind me</span></button>
  </div>`;
}
function tick(){clearInterval(timerId);timerId=setInterval(()=>{const el=document.getElementById("timer");if(!el){clearInterval(timerId);return;}let s=Math.max(0,Math.floor((dropEnd-Date.now())/1000));const h=String(Math.floor(s/3600)).padStart(2,"0"),m=String(Math.floor(s%3600/60)).padStart(2,"0"),x=String(s%60).padStart(2,"0");el.textContent=`${h}:${m}:${x}`;},1000);}



render();
setTimeout(showPush,900);
</script>
</body>
</html>
